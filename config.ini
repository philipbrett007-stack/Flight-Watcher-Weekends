; Flight Watcher configuration.
; Nothing sensitive belongs in this file — the Gmail app password is read
; from the EMAIL_APP_PASSWORD environment variable (see .env.example).

[origins]
; Departure airports to check, comma-separated IATA codes.
airports = ORK,SNN

[search]
; Country codes to exclude from destination candidates (comma-separated
; ISO alpha-2). IE = Ireland (Republic + this also filters Northern
; Ireland airports, which are listed separately below).
exclude_countries = IE
; How many cheapest destinations to keep per origin (1 = just the winner).
top_n_results = 3
; If the tool happens to run ON a Friday, does "upcoming Friday" mean
; today, or next week's Friday? true = today, false = next week.
on_friday_means_today = false
; Trip length in nights (Friday departure -> Sunday return = 2).
trip_nights = 2
; Currency for prices (ISO code Google Flights understands).
currency = EUR

[schedule]
; 24-hour time, local to the timezone below.
time = 18:00
timezone = Europe/Dublin

[email]
enabled = true
subject = Phil's Low Cost Flight Analysis
sender = philipbrett007@gmail.com
recipient = philipbrett007@gmail.com
smtp_server = smtp.gmail.com
smtp_port = 465
; Also send an email after a manual "Run Now" (not just the 18:00 job)?
send_on_manual_run = false
